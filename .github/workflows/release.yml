name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: tagpr
        uses: Songmu/tagpr@v1.21.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.tagpr.outputs.tag != ''
        uses: cachix/install-nix-action@v31.11.1
      - if: steps.tagpr.outputs.tag != ''
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
        run: nix develop --command ./gradlew build publishToMavenCentral
      - if: steps.tagpr.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tagpr.outputs.tag }}
        run: |
          gh release upload "$TAG" "build/libs/errorprone-tidy-${TAG#v}.jar"
          gh release edit "$TAG" --draft=false
